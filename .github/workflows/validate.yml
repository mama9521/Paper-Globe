name: Validate Paper Globe
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - name: Verify browser availability
        run: google-chrome --version
      - name: Source, type, unit, and browser-engine checks
        run: npm run check
      - name: Production Worker build
        run: npm run build
      - name: React workflow smoke tests
        run: |
          npm run dev -- --port 4173 > /tmp/paper-globe-dev.log 2>&1 &
          SERVER=$!
          trap 'kill "$SERVER" || true' EXIT
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          npm run test:workflow -- http://127.0.0.1:4173 || { cat /tmp/paper-globe-dev.log; exit 1; }
      - name: No source changes during validation
        run: git diff --exit-code
